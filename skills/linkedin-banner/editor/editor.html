<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bannia Editor</title>
<style>
@font-face { font-family: "Inter"; src: url("/editor/inter.woff2") format("woff2"); font-weight: 100 900; }
:root {
  --bg: #ffffff; --canvas: #f2f6fc; --panel: #ffffff; --raised: #f3f7fd; --hover: #eaf2fd;
  --line: #e1e9f4; --line2: #cfdcec; --ink: #0a3d7a; --soft: #3f6593; --muted: #7d95b4;
  --accent: #1f78ee; --accent-soft: rgba(31,120,238,.10); --accent-grad: linear-gradient(135deg, #4fa6ff 0%, #1f78ee 45%, #0b5cc4 100%);
  --select: #1f78ee; --warn: #f2c14e; --danger: #f0705f;
  --r: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { display: grid; height: 100vh; grid-template: 54px minmax(0, 1fr) 92px / 62px minmax(0, 1fr) 304px; grid-template-areas: "top top top" "rail stage side" "rail strip side"; }

/* Barre du haut */
#top { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
.brand svg { display: block; width: 22px; height: 22px; }
.brand b { font-weight: 650; }
.brand span { color: var(--soft); font-weight: 500; }
#bannerName { margin-left: 10px; padding-left: 14px; border-left: 1px solid var(--line2); color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; min-width: 6px; }
.icon { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r); color: var(--soft); transition: background .12s, color .12s; }
.icon:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: var(--r); color: var(--soft); white-space: nowrap; transition: background .12s, color .12s; }
.pill:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.pill.on { background: var(--accent-soft); color: var(--accent); }
.pill:disabled { opacity: .35; cursor: default; }
.primary { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 15px; margin-left: 6px; border-radius: var(--r); background: var(--accent-grad); color: #fff; font-weight: 650; white-space: nowrap; transition: filter .12s; }
.primary:hover:not(:disabled) { filter: brightness(1.08); }
#status { color: var(--muted); font-size: 12px; white-space: nowrap; margin-right: 6px; }
.sep { width: 1px; height: 22px; margin: 0 6px; background: var(--line2); flex: none; }

/* Outils */
#rail { grid-area: rail; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; scrollbar-width: none; }
.tool { position: relative; display: grid; place-items: center; width: 42px; height: 40px; flex: none; border-radius: 10px; color: var(--soft); transition: background .12s, color .12s; }
.tool:hover { background: var(--hover); color: var(--ink); }
.tool.on { background: var(--accent-grad); color: #fff; }
.rail-sep { width: 26px; height: 1px; margin: 6px 0; background: var(--line2); flex: none; }
[data-tip] { position: relative; }
#tip { position: fixed; z-index: 50; padding: 5px 9px; border-radius: 6px; background: #0a3d7a; color: #fff; font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; }
#tip kbd { margin-left: 8px; color: #a9c8ef; font: inherit; }

/* Canevas */
#stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; background-color: var(--canvas); background-image: radial-gradient(rgba(10,61,122,.10) 1px, transparent 1px); background-size: 20px 20px; }
#scroller { position: absolute; inset: 0; display: flex; overflow: auto; padding: 44px; scrollbar-color: var(--line2) transparent; }
#sizer { position: relative; margin: auto; flex: none; }
#frameWrap { position: absolute; left: 0; top: 0; width: 1584px; height: 396px; transform-origin: 0 0; border-radius: 3px; box-shadow: 0 0 0 1px rgba(10,61,122,.08), 0 26px 60px rgba(10,61,122,.22); }
iframe#frame { position: absolute; inset: 0; width: 1584px; height: 396px; border: 0; display: block; background: #222; }
#overlay { position: absolute; inset: 0; width: 1584px; height: 396px; pointer-events: none; overflow: visible; }
#handles .h { pointer-events: all; cursor: nwse-resize; }
#handles .h.ne, #handles .h.sw { cursor: nesw-resize; }
#handles .rot { pointer-events: all; cursor: grab; }
body.commenting #warn { top: 58px; }
#commentBar { position: absolute; left: 50%; top: 10px; z-index: 5; transform: translateX(-50%); display: none; gap: 2px; padding: 4px; border-radius: 11px; background: var(--raised); border: 1px solid var(--line2); box-shadow: 0 10px 28px rgba(10,61,122,.14); }
body.commenting #commentBar { display: flex; }
#commentBar button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 7px; color: var(--soft); font-size: 12.5px; white-space: nowrap; }
#commentBar button:hover { background: var(--hover); color: var(--ink); }
#commentBar button.on { background: var(--accent-soft); color: var(--accent); }
#commentBar svg.i { width: 15px; height: 15px; }

#zoomBar { position: absolute; left: 50%; bottom: 16px; z-index: 5; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 11px; background: var(--raised); border: 1px solid var(--line2); box-shadow: 0 10px 28px rgba(10,61,122,.14); }
#zoomBar .icon { width: 30px; height: 30px; }
#zoomPct { min-width: 52px; height: 30px; border-radius: 7px; color: var(--ink); font-size: 12.5px; font-variant-numeric: tabular-nums; }
#zoomPct:hover { background: var(--hover); }
#warn { position: absolute; left: 50%; top: 14px; z-index: 5; transform: translateX(-50%); display: none; align-items: center; gap: 8px; max-width: 78%; padding: 7px 13px; border-radius: 9px; background: rgba(36,30,14,.96); border: 1px solid rgba(242,193,78,.34); color: var(--warn); font-size: 12.5px; }

#compare { position: absolute; inset: 0; display: none; overflow: auto; padding: 26px 34px 34px; }
.card { margin: 0 auto 22px; max-width: 1200px; }
.card header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.card h3 { margin: 0; font-size: 13px; font-weight: 600; }
.card .box { position: relative; overflow: hidden; border-radius: 4px; box-shadow: 0 0 0 1px rgba(10,61,122,.08), 0 16px 36px rgba(10,61,122,.18); }
.card iframe, .card svg { position: absolute; left: 0; top: 0; width: 1584px; height: 396px; transform-origin: 0 0; border: 0; pointer-events: none; }

/* Bannières */
#strip { grid-area: strip; display: flex; align-items: flex-start; gap: 12px; padding: 7px 16px 0; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.filters { flex: none; display: flex; flex-direction: column; gap: 5px; max-width: 250px; }
.filters .seg { flex-wrap: wrap; }
.filters .seg button { flex: 0 1 auto; height: 22px; padding: 0 7px; font-size: 11px; white-space: nowrap; }
.thumbs { display: flex; gap: 10px; flex: none; }
.thumb { flex: none; text-align: left; }
.thumb .pic { position: relative; display: block; height: 42px; overflow: hidden; border-radius: 5px; background: #e6eef8; box-shadow: 0 0 0 1px var(--line2); transition: box-shadow .12s; }
.thumb:hover .pic { box-shadow: 0 0 0 1px var(--muted); }
.thumb.on .pic { box-shadow: 0 0 0 2px var(--accent); }
.thumb iframe { border: 0; transform-origin: 0 0; pointer-events: none; }
.thumb b { display: block; margin-top: 4px; font-size: 11.5px; font-weight: 500; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.on b { color: var(--ink); }
.add { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 92px; height: 42px; border: 1px dashed var(--line2); border-radius: 5px; color: var(--soft); font-size: 11.5px; }
.add:hover { border-color: var(--muted); color: var(--ink); background: var(--raised); }

/* Inspecteur */
#side { grid-area: side; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; flex: none; gap: 2px; padding: 8px; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; height: 30px; border-radius: 7px; color: var(--muted); font-weight: 550; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { background: var(--raised); color: var(--ink); }
#panel, #comments { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
#comments { display: none; padding: 14px; }
.sec { padding: 14px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h4 { margin: 0 0 11px; font-size: 11.5px; font-weight: 650; color: var(--muted); letter-spacing: .01em; }
.title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.title strong { font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--muted); line-height: 1.5; margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.f { display: flex; align-items: center; height: 32px; padding: 0 9px; gap: 7px; border-radius: 7px; background: var(--raised); border: 1px solid transparent; min-width: 0; }
.f:focus-within { border-color: var(--accent); }
.f > span { flex: none; color: var(--muted); font-size: 11.5px; }
.f input { width: 100%; min-width: 0; border: 0; background: none; outline: 0; text-align: right; font-variant-numeric: tabular-nums; }
.f input[type=number] { -moz-appearance: textfield; }
.f input::-webkit-inner-spin-button { display: none; }
.f select { width: 100%; min-width: 0; border: 0; outline: 0; background: none; text-align: right; }
.f select option { background: var(--raised); }
textarea.txt { display: block; width: 100%; min-height: 58px; margin-bottom: 7px; padding: 8px 9px; resize: vertical; border-radius: 7px; background: var(--raised); border: 1px solid transparent; outline: 0; line-height: 1.4; }
textarea.txt:focus { border-color: var(--accent); }
.color { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px 0 5px; border-radius: 7px; background: var(--raised); cursor: pointer; }
.color input { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: none; cursor: pointer; }
.color input::-webkit-color-swatch-wrapper { padding: 0; }
.color input::-webkit-color-swatch { border: 1px solid rgba(10,61,122,.18); border-radius: 5px; }
.color span { color: var(--soft); font-size: 12px; }
.slider { display: grid; grid-template-columns: 72px 1fr 34px; align-items: center; gap: 8px; height: 30px; color: var(--soft); font-size: 12px; }
.slider input { width: 100%; accent-color: var(--accent); }
.slider output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--raised); }
.seg button { flex: 1; display: grid; place-items: center; height: 28px; border-radius: 5px; color: var(--soft); }
.seg button:hover { background: var(--hover); color: var(--ink); }
.seg button.on { background: var(--line2); color: var(--ink); }
.seg svg.i { width: 16px; height: 16px; }
.lab { margin: 10px 0 5px; color: var(--muted); font-size: 11.5px; }
.lab:first-of-type { margin-top: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 32px; padding: 0 10px; border-radius: 7px; background: var(--raised); color: var(--soft); }
.btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn + .btn { margin-top: 6px; }
.btn svg.i { width: 15px; height: 15px; }
.comment { padding: 10px; margin-bottom: 8px; border-radius: 8px; background: var(--raised); font-size: 12.5px; }
.comment b { display: flex; gap: 7px; align-items: center; margin-bottom: 5px; font-weight: 600; color: var(--ink); }
.comment b i { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--select); color: #fff; font-style: normal; font-size: 10.5px; }
.comment .act { display: flex; gap: 6px; margin-top: 8px; }
.comment .act button { padding: 3px 8px; border-radius: 5px; background: var(--hover); color: var(--soft); font-size: 11.5px; }
.comment .act button:hover { color: var(--ink); }

#toast { position: fixed; right: 320px; bottom: 108px; z-index: 40; display: none; width: 340px; padding: 11px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line2); box-shadow: 0 18px 50px rgba(10,61,122,.18); }
#toast img { display: block; width: 100%; margin-bottom: 9px; border-radius: 4px; }
#toast div { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#toast a { color: var(--accent); font-weight: 600; text-decoration: none; }
#toast small { color: var(--muted); }
/* Fête ou thème */
.seg.wrap { flex-wrap: wrap; }
.seg.wrap button { flex: 0 1 auto; height: 26px; padding: 0 8px; font-size: 11.5px; white-space: nowrap; }
.f.text input { text-align: left; }
.f.text + .f.text, .seg + .f.text, .f.text + textarea.txt { margin-top: 7px; }
textarea.prompt { min-height: 150px; margin-top: 9px; font-size: 11.5px; color: var(--soft); }

/* Bibliothèque */
#library { position: fixed; inset: 0; z-index: 45; display: none; place-items: center; background: rgba(10,30,60,.32); }
#library.open { display: grid; }
.lib { display: flex; flex-direction: column; width: min(940px, calc(100vw - 32px)); max-height: calc(100vh - 64px); border-radius: 14px; background: var(--panel); box-shadow: 0 24px 70px rgba(10,61,122,.28); overflow: hidden; }
.lib > header { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.lib > header h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.lib .path { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.lib .path code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font: 12px ui-monospace, Consolas, monospace; }
.lib .path .f { flex: 1; }
.lib .btn.small { width: auto; flex: none; margin: 0; }
.lib .note { display: flex; align-items: center; gap: 12px; margin: 14px 18px 0; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); color: var(--ink); }
.lib .note p { flex: 1; margin: 0; }
.lib .err { margin: 10px 18px 0; color: var(--danger); }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 16px 18px 18px; overflow-y: auto; }
.project { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; text-align: left; transition: border-color .12s, background .12s; }
.project:hover { border-color: var(--muted); background: var(--raised); }
.project.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.project .cover { position: relative; display: block; width: 100%; aspect-ratio: 4 / 1; overflow: hidden; border-radius: 6px; background: #e6eef8; }
.project .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.project .cover iframe { position: absolute; left: 0; top: 0; width: 1584px; height: 396px; border: 0; transform-origin: 0 0; pointer-events: none; }
.project b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.project small { color: var(--muted); }
.lib .emptylib { padding: 28px 18px; color: var(--muted); }
@media (max-width: 1050px) { .pill span.lbl, #bannerName { display: none; } #app { grid-template-columns: 56px minmax(0, 1fr) 262px; } #toast { right: 276px; } }
@media (max-width: 760px) { #app { grid-template: 54px minmax(180px, 1fr) 92px minmax(0, 1fr) / 56px minmax(0, 1fr); grid-template-areas: "top top" "rail stage" "rail strip" "side side"; } #side { border-left: 0; border-top: 1px solid var(--line); } #toast { right: 12px; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><svg viewBox="40 28 176 200" aria-hidden="true"><defs><linearGradient id="bannia-grad" gradientUnits="userSpaceOnUse" x1="40" y1="28" x2="216" y2="228"><stop offset="0" stop-color="#7CC6FF"/><stop offset=".38" stop-color="#2A8BF2"/><stop offset=".72" stop-color="#0B5CC4"/><stop offset="1" stop-color="#083A7A"/></linearGradient></defs><path fill="url(#bannia-grad)" d="M40 28H154A46 46 0 0 1 154 120H40Z M40 136H174A46 46 0 0 1 174 228H40Z"/></svg><b>Bannia</b><span>Editor</span></div>
    <div id="bannerName"></div>
    <div class="sep"></div>
    <button class="pill" id="openLibrary" data-tip="Ouvrir une bannière de ta bibliothèque"></button>
    <div class="sep"></div>
    <button class="icon" id="undo" data-tip="Annuler" data-key="Ctrl+Z" aria-label="Annuler" disabled></button>
    <button class="icon" id="redo" data-tip="Rétablir" data-key="Ctrl+Y" aria-label="Rétablir" disabled></button>
    <span class="spacer"></span>
    <span id="status" role="status"></span>
    <button class="pill on" id="toggleZone" data-tip="Afficher la zone à laisser vide sur mobile"></button>
    <button class="pill" id="togglePhoto" data-tip="Simuler ta photo de profil"></button>
    <button class="pill" id="toggleCompare" data-tip="Voir toutes les bannières l'une sous l'autre"></button>
    <button class="primary" id="export"></button>
  </header>

  <nav id="rail" aria-label="Outils"></nav>

  <main id="stage">
    <div id="scroller">
      <div id="sizer">
        <div id="frameWrap">
          <iframe id="frame" title="Bannière"></iframe>
          <svg id="overlay" viewBox="0 0 1584 396" aria-hidden="true">
            <defs>
              <clipPath id="photoClip"><circle id="photoClipC"/></clipPath>
              <clipPath id="zoneClip"><rect id="zoneClipR"/></clipPath>
            </defs>
            <g id="zone" clip-path="url(#zoneClip)"></g>
            <g id="photoLayer" display="none">
              <circle id="photoRing" fill="#fff"/>
              <image id="photoImg" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
            </g>
            <rect id="hover" fill="none" stroke="#1f78ee" stroke-width="1.5" display="none"/>
            <g id="selection" fill="none" stroke="#1f78ee" stroke-width="2"></g>
            <g id="handles"></g>
            <rect id="marquee" fill="rgba(31,120,238,.12)" stroke="#1f78ee" stroke-width="1.5" display="none"/>
            <g id="pins"></g>
          </svg>
        </div>
      </div>
    </div>
    <div id="compare"></div>
    <div id="warn" role="status"></div>
    <div id="commentBar" role="toolbar" aria-label="Façons de commenter"></div>
    <div id="zoomBar">
      <button class="icon" id="zoomOut" data-tip="Dézoomer" data-key="Ctrl + molette" aria-label="Dézoomer"></button>
      <button id="zoomPct" data-tip="Ajuster à l'écran">100 %</button>
      <button class="icon" id="zoomIn" data-tip="Zoomer" data-key="Ctrl + molette" aria-label="Zoomer"></button>
    </div>
  </main>

  <div id="strip" aria-label="Bannières"></div>

  <aside id="side">
    <div class="tabs" role="tablist">
      <button id="tabProps" class="on" role="tab">Propriétés</button>
      <button id="tabComments" role="tab">Retours pour l'IA</button>
    </div>
    <div id="panel"></div>
    <div id="comments"></div>
  </aside>
</div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>
<div id="library" role="dialog" aria-modal="true" aria-label="Mes bannières"></div>
<input id="filePick" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

<script>
const $ = (id) => document.getElementById(id);
const frame = $("frame");
const SIZE = { w: 1584, h: 396 };
const NS = "http://www.w3.org/2000/svg";
// Zones à laisser vides et photo simulée, par format. Valeurs estimées : à vérifier sur la vraie plateforme.
const FORMATS = {
  linkedin: { label: "LinkedIn", avoid: { x: 297, y: 396, r: 270 }, photo: { x: 197, y: 340, r: 150 } },
  x: { label: "X", avoid: { x: 190, y: 500, r: 230 }, photo: { x: 165, y: 480, r: 125 } },
  facebook: { label: "Facebook", safe: { x: 180, y: 0, w: 1280, h: 624 }, photo: { x: 230, y: 610, r: 170 } },
  whatsapp: { label: "WhatsApp", safe: { x: 150, y: 90, w: 911, h: 501 }, photo: { x: 605, y: 660, r: 120 } },
  featured: { label: "Sélection" },
};
const FILTERS = [["all", "Tous"], ["linkedin", "LinkedIn"], ["x", "X"], ["facebook", "Facebook"], ["whatsapp", "WhatsApp"], ["featured", "Sélection"]];

function drawPins() {
  const g = $("pins");
  g.replaceChildren();
  const all = pendingPin ? [...comments, pendingPin] : [...comments];
  const draft = markDraft && markFromDraft(markDraft);
  if (draft) all.push(draft);
  const s = 1 / (scale || 1), color = "#1f78ee";
  const make = (tag, attrs) => { const n = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); g.append(n); return n; };
  const stroke = { fill: "none", stroke: color, "stroke-width": 3 * s, "stroke-linecap": "round", "stroke-linejoin": "round" };
  all.forEach((c, i) => {
    if (c.kind === "zone") make("rect", { x: c.x, y: c.y, width: c.w, height: c.h, fill: "rgba(31,120,238,.12)", stroke: color, "stroke-width": 2.5 * s });
    if (c.kind === "pen") make("polyline", { ...stroke, points: c.path.map((p) => p.join(",")).join(" ") });
    if (c.kind === "arrow") {
      const a = Math.atan2(c.y2 - c.y, c.x2 - c.x), l = 18 * s;
      make("line", { ...stroke, x1: c.x, y1: c.y, x2: c.x2, y2: c.y2 });
      make("polygon", { fill: color, points: [[c.x2, c.y2], [c.x2 - l * Math.cos(a - .45), c.y2 - l * Math.sin(a - .45)], [c.x2 - l * Math.cos(a + .45), c.y2 - l * Math.sin(a + .45)]].map((p) => p.join(",")).join(" ") });
    }
    make("circle", { cx: c.x, cy: c.y, r: 13 * s, fill: color, stroke: "#fff", "stroke-width": 2 * s });
    make("text", { x: c.x, y: c.y + 4.700 * s, "text-anchor": "middle", fill: "#fff", "font-size": 13.500 * s, "font-family": "Inter, sans-serif", "font-weight": 650 }).textContent = i + 1;
  });
}

  return [
    `Avec le skill banner-festive, crée la version ${name} de ma bannière.`,
    "",
    `- Bannière de départ : ${b.dir || b.name}`,
    `- Fête ou thème : ${name}`,
    `- Intensité : ${level}`,
    `- Message de fête : ${festive.message.trim() || "aucun, seulement l'ambiance"}`,
    `- Offre : ${festive.offer.trim() || "aucune"}`,
    "- Langues : français et anglais",
    `- Enregistrement : dans le même projet${project ? `, ${project}` : ""}`,
    "",
    "Garde ma tagline, mes couleurs et mon call to action. Exporte les PNG, vérifie-les, puis ouvre l'éditeur sur ce projet.",
  ].join("\n");
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {
    const area = h("textarea", { value: text });
    document.body.append(area);
    area.select();
    const ok = document.execCommand("copy");
    area.remove();
    return ok;
  }
}
function festiveSection() {
  const box = sec(null);
  const draw = () => {
    const chips = h("div", { className: "seg wrap" });
    [...Object.keys(OCCASIONS), "autre"].forEach((id) => {
      chips.append(h("button", { className: festive.occasion === id ? "on" : "", textContent: id === "autre" ? "Autre…" : occasionLabel(id), onclick: () => { festive.occasion = id; draw(); } }));
    });
    const levels = h("div", { className: "seg wrap" });
    LEVELS.forEach(([id, text]) => levels.append(h("button", { className: festive.level === id ? "on" : "", textContent: text, onclick: () => { festive.level = id; draw(); } })));
    const preview = h("textarea", { className: "txt prompt", readOnly: true, value: festivePrompt() });
    preview.setAttribute("aria-label", "Prompt à copier");
    const field = (label, key, placeholder) => {
      const input = h("input", { type: "text", value: festive[key], placeholder });
      input.setAttribute("aria-label", label);
      input.oninput = () => { festive[key] = input.value; preview.value = festivePrompt(); };
      return h("label", { className: "f text" }, h("span", { textContent: label }), input);
    };
    const kids = [chips];
    if (festive.occasion === "autre") kids.push(field("Thème", "custom", "Ex. Coupe du monde"));
    kids.push(lab("Intensité"), levels, field("Message", "message", "Facultatif"), field("Offre", "offer", "Facultatif, avec ses conditions"), preview,
      btn("sparkle", "Copier le prompt", async () => {
        const ok = await copyText(festivePrompt());
        if (!ok) { preview.focus(); preview.select(); }
        setStatus(ok ? "Prompt copié : colle-le dans Claude" : "Texte sélectionné : copie-le avec Ctrl+C");
      }));
    box.replaceChildren(h("h4", { textContent: "Adapter à une fête ou un thème" }), ...kids);
  };
  draw();
  return box;
}

(async function start() {
  buildRail();
  buildCommentBar();
  const data = await (await fetch("/api/banners")).json();
  banners = data.banners;
  photo = data.photo;
  loadLibrary().then(() => { if (doc && !selected && group.length < 2) renderProps(); });
  const asked = new URLSearchParams(location.search).get("b");
  current = banners.some((b) => b.id === asked) ? asked : (banners.find((b) => b.id !== "_root") || banners[0]).id;
  renderStrip();
  applyFormat(banners.find((b) => b.id === current));
  $("bannerName").textContent = nameOfBanner(current);
  frame.src = `/b/${current}/banner.html?t=${Date.now()}`;
  layout();
})();
</script>
